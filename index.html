<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElevenLabs AI Voice Studio - Puter.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --border: #333;
      --success: #10b981;
      --warning: #f59e0b;
    }
    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --accent: #4f46e5;
      --accent-hover: #3730a3;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border: #e2e8f0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .tabs {
      display: flex;
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .tab {
      flex: 1;
      padding: 12px 20px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }
    .tab.active {
      background: var(--accent);
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 16px;
      transition: all 0.3s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 160px;
      justify-content: center;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 2px solid var(--border);
    }
    .status {
      padding: 16px;
      border-radius: 10px;
      margin: 20px 0;
      font-weight: 500;
      text-align: center;
    }
    .status.loading {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid var(--accent);
    }
    .status.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .audio-section {
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 24px;
      margin: 24px 0;
      border: 1px solid var(--border);
    }
    .audio-section h3 {
      margin-bottom: 16px;
      color: var(--accent);
    }
    audio {
      width: 100%;
      margin: 12px 0;
    }
    .download-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--success), #059669);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .download-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .tabs { flex-direction: column; }
      .header h1 { font-size: 2rem; }
    }
    .record-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .record-btn.recording {
      background: linear-gradient(135deg, var(--success), #10b981);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark/Light</button>
  
  <div class="container">
    <div class="header">
      <h1>🎙️ ElevenLabs AI Voice Studio</h1>
      <p>Free unlimited TTS + Voice Changer powered by Puter.js</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="tts">Text to Speech</div>
      <div class="tab" data-tab="voice-changer">Voice Changer</div>
    </div>

    <!-- TTS Tab -->
    <div id="tts" class="tab-content active">
      <div class="grid">
        <div class="form-group">
          <label>📝 Text to Convert</label>
          <textarea id="tts-text" placeholder="Enter your text here...">Welcome to ElevenLabs AI Voice Studio! This is powered by Puter.js completely free.</textarea>
        </div>
        <div>
          <div class="form-group">
            <label>🎤 Voice ID</label>
            <input id="tts-voice" type="text" value="21m00Tcm4TlvDq8ikWAM" placeholder="Rachel (default sample)">
          </div>
          <div class="form-group">
            <label>⚙️ Model</label>
            <select id="tts-model">
              <option value="eleven_multilingual_v2">🌍 Multilingual V2 (Best Quality)</option>
              <option value="eleven_flash_v2_5">⚡ Flash V2.5 (Fast)</option>
              <option value="eleven_turbo_v2_5">🚀 Turbo V2.5 (Ultra Fast)</option>
              <option value="eleven_v3">✨ Eleven V3 (Latest)</option>
            </select>
          </div>
          <div class="form-group">
            <label>🎵 Format</label>
            <select id="tts-format">
              <option value="mp3_44100_128">MP3 Standard</option>
              <option value="mp3_44100_192">MP3 High Quality</option>
              <option value="pcm_16000">PCM 16kHz</option>
              <option value="pcm_24000">PCM 24kHz</option>
              <option value="ulaw_8000">μLaw 8kHz</option>
            </select>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" id="tts-generate">
        🎙️ Generate & Play
      </button>
    </div>

    <!-- Voice Changer Tab -->
    <div id="voice-changer" class="tab-content">
      <div class="grid">
        <div class="form-group">
          <label>🎤 Record Your Voice</label>
          <button class="btn record-btn" id="record-btn">
            🔴 Start Recording
          </button>
          <audio id="original-audio" controls style="width: 100%; margin-top: 12px; display: none;"></audio>
        </div>
        <div>
          <div class="form-group">
            <label>🎤 Target Voice ID</label>
            <input id="vc-voice" type="text" value="21m00Tcm4TlvDq8ikWAM" placeholder="Rachel (default)">
          </div>
          <div class="form-group">
            <label>⚙️ Model</label>
            <select id="vc-model">
              <option value="eleven_multilingual_sts_v2">🌍 Multilingual STS V2</option>
            </select>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" id="vc-convert">
        🔄 Convert Voice
      </button>
    </div>

    <!-- Status -->
    <div id="status" class="status" style="display: none;"></div>

    <!-- Results -->
    <div class="audio-section" id="results" style="display: none;">
      <h3>🎵 Generated Audio</h3>
      <audio id="result-audio" controls></audio>
      <br>
      <a id="download-link" class="download-link" style="display: none;">
        💾 Download Audio
      </a>
    </div>
  </div>

  <!-- Puter.js -->
  <script src="https://js.puter.com/v2/"></script>
  
  <script>
    // Theme toggle
    function toggleTheme() {
      const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
    }
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // Elements
    const statusEl = document.getElementById('status');
    const resultAudio = document.getElementById('result-audio');
    const downloadLink = document.getElementById('download-link');
    const resultsEl = document.getElementById('results');

    // Status helper
    function updateStatus(message, type = 'loading') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      statusEl.style.display = 'block';
    }

    // TTS Generate
    document.getElementById('tts-generate').addEventListener('click', async () => {
      const btn = event.target;
      const text = document.getElementById('tts-text').value.trim();
      const voice = document.getElementById('tts-voice').value.trim();
      const model = document.getElementById('tts-model').value;
      const format = document.getElementById('tts-format').value;

      if (!text || !voice) {
        updateStatus('Please fill text and voice ID', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '⏳ Generating...';
      updateStatus('Converting text to speech...');

      try {
        const audio = await puter.ai.txt2speech(text, {
          provider: 'elevenlabs',
          voice: voice,
          model: model,
          output_format: format
        });

        // Show results
        const src = audio.toString ? audio.toString() : audio.src || URL.createObjectURL(audio);
        resultAudio.src = src;
        resultAudio.play();
        resultsEl.style.display = 'block';
        
        downloadLink.href = src;
        downloadLink.download = `tts-${Date.now()}.mp3`;
        downloadLink.style.display = 'inline-flex';
        
        updateStatus('✅ Audio generated successfully!', 'success');
      } catch (error) {
        updateStatus(`❌ Error: ${error.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🎙️ Generate & Play';
      }
    });

    // Voice Changer - Recording
    let mediaRecorder;
    let recordedChunks = [];
    const recordBtn = document.getElementById('record-btn');
    const originalAudio = document.getElementById('original-audio');

    recordBtn.addEventListener('click', async () => {
      if (!mediaRecorder || mediaRecorder.state === 'recording') {
        // Start recording
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          originalAudio.src = url;
          originalAudio.style.display = 'block';
          recordedChunks = [];
        };

        mediaRecorder.start();
        recordBtn.classList.add('recording');
        recordBtn.innerHTML = '⏹️ Stop Recording';
      } else {
        // Stop recording
        mediaRecorder.stop();
        recordBtn.classList.remove('recording');
        recordBtn.innerHTML = '🔴 Start Recording';
      }
    });

    // Voice Conversion
    document.getElementById('vc-convert').addEventListener('click', async () => {
      const btn = event.target;
      const voice = document.getElementById('vc-voice').value.trim();
      const model = document.getElementById('vc-model').value;

      if (!originalAudio.src) {
        updateStatus('Please record audio first', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '🔄 Converting...';
      updateStatus('Converting voice...');

      try {
        const audio = await puter.ai.speech2speech(originalAudio.src, {
          voice: voice,
          model: model
        });

        const src = audio.toString ? audio.toString() : audio.src;
        resultAudio.src = src;
        resultAudio.play();
        resultsEl.style.display = 'block';
        
        downloadLink.href = src;
        downloadLink.download = `voice-change-${Date.now()}.mp3`;
        downloadLink.style.display = 'inline-flex';
        
        updateStatus('✅ Voice converted successfully!', 'success');
      } catch (error) {
        updateStatus(`❌ Error: ${error.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔄 Convert Voice';
      }
    });
  </script>
</body>
</html>
