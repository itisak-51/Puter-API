<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElevenLabs Pro Studio</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0a0a;--bg2:#1a1a1a;--accent:#6366f1;--text:#fff;--border:#333;--success:#10b981}body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}.container{max-width:1100px;margin:0 auto;padding:20px}.header{text-align:center;margin-bottom:30px}.header h1{font-size:2.2rem;background:linear-gradient(135deg,var(--accent),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.tabs{display:flex;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:25px}.tab{flex:1;padding:12px 20px;text-align:center;border-radius:8px;cursor:pointer;font-weight:500}.tab.active{background:var(--accent);color:#fff}.tab-content{display:none}.tab-content.active{display:block}.form-group{margin-bottom:20px}.form-group label{display:block;margin-bottom:8px;font-weight:600}input,textarea,select{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-size:15px}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}.btn{padding:12px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;transition:all .3s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.4)}.btn:disabled{opacity:.6;cursor:not-allowed}.status{padding:14px;border-radius:8px;margin:20px 0;font-weight:500;text-align:center;display:none}.status.loading{background:rgba(99,102,241,.15);border:1px solid var(--accent);display:block}.status.success{background:rgba(16,185,129,.15);border:1px solid var(--success);display:block;color:var(--success)}.status.error{background:rgba(239,68,68,.15);border:1px solid #ef4444;display:block;color:#ef4444}.audio-section{background:var(--bg2);border-radius:12px;padding:20px;margin:20px 0;display:none;border:1px solid var(--border)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:768px){.grid{grid-template-columns:1fr}}.api-status{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg2);border-radius:8px;margin-bottom:15px}.api-info{font-size:14px;color:var(--success)}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎙️ ElevenLabs Pro Studio</h1>
      <p>Multiple API Rotation | TTS + Voice Changer | Unlimited</p>
    </div>

    <!-- API Status -->
    <div class="api-status">
      <span id="current-api">API: Key #1</span>
      <span id="usage">Used: 0/10 req/min</span>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="tts">🔤 Text-to-Speech</div>
      <div class="tab" data-tab="stt">🎤 Voice Changer</div>
    </div>

    <!-- TTS Tab -->
    <div id="tts" class="tab-content active">
      <div class="grid">
        <div>
          <div class="form-group">
            <label>📝 Text to Speech</label>
            <textarea id="text" rows="4">Hello! This is professional ElevenLabs TTS with API rotation.</textarea>
          </div>
          <div class="form-group">
            <label>🎤 Voice ID</label>
            <input id="voice" value="21m00Tcm4TlvDq8ikWAM">
          </div>
        </div>
        <div>
          <div class="form-group">
            <label>🧠 Model</label>
            <select id="model">
              <option value="eleven_multilingual_v2">🌍 Multilingual V2 (Best)</option>
              <option value="eleven_turbo_v2_5">🚀 Turbo V2.5 (Fastest)</option>
              <option value="eleven_flash_v2_5">⚡ Flash V2.5</option>
              <option value="eleven_monolingual_v1">🇺🇸 English V1</option>
            </select>
          </div>
          <div class="form-group">
            <label>🎵 Output Format</label>
            <select id="format">
              <option value="mp3_44100_128">MP3 128kbps</option>
              <option value="mp3_44100_192">MP3 192kbps</option>
              <option value="pcm_16000">PCM 16kHz</option>
              <option value="pcm_24000">PCM 24kHz</option>
            </select>
          </div>
          <div class="form-group">
            <label>🔊 Stability (0-1)</label>
            <input id="stability" type="range" min="0" max="1" step="0.1" value="0.5">
            <span id="stability-val">0.5</span>
          </div>
        </div>
      </div>
      <button class="btn" id="tts-btn">🎙️ Generate Speech</button>
    </div>

    <!-- Voice Changer Tab -->
    <div id="stt" class="tab-content">
      <div class="grid">
        <div>
          <div class="form-group">
            <label>🎤 Record Your Voice</label>
            <button class="btn" id="record-btn">🔴 Start Recording</button>
            <audio id="input-audio" controls style="width:100%;margin-top:10px;display:none;"></audio>
          </div>
          <div class="form-group">
            <label>🎤 Target Voice ID</label>
            <input id="stt-voice" value="EXAVITQu4vr4xnSDxMaL">
          </div>
        </div>
        <div>
          <div class="form-group">
            <label>🧠 Model</label>
            <select id="stt-model">
              <option value="eleven_multilingual_v2">Multilingual V2</option>
            </select>
          </div>
        </div>
      </div>
      <button class="btn" id="stt-btn">🔄 Convert Voice</button>
    </div>

    <!-- Status & Results -->
    <div id="status" class="status"></div>
    <div class="audio-section" id="audio-section">
      <h3>🎵 Generated Audio</h3>
      <audio id="player" controls></audio>
      <br>
      <a id="download" class="btn" style="display:none;width:200px;margin-top:10px;">💾 Download MP3</a>
    </div>
  </div>

  <script>
    // ========== YOUR API KEYS - EDIT THIS ARRAY ==========
    const API_KEYS = [
      'sk_05e0261ae7df29e2a42c99efb844c1fb30bfa992e6581c2d',
      'sk_05e0261ae7df29e2a42c99efb844c1fb30bfa992e6581c2d', 
      'sk_946cbef596783e5f0bdec0d783965dba413d14a5827b035f',
      // Add more keys...
    ];
    // =====================================================

    let currentKeyIndex = 0;
    let requestCount = 0;
    let mediaRecorder, recordedChunks = [];
    const els = {
      apiStatus: document.getElementById('current-api'),
      usage: document.getElementById('usage'),
      status: document.getElementById('status'),
      player: document.getElementById('player'),
      download: document.getElementById('download'),
      audioSection: document.getElementById('audio-section'),
      stabilityVal: document.getElementById('stability-val')
    };

    // Rotate API Key
    function getNextApiKey() {
      const key = API_KEYS[currentKeyIndex];
      currentKeyIndex = (currentKeyIndex + 1) % API_KEYS.length;
      requestCount++;
      updateApiStatus(key);
      return key;
    }

    function updateApiStatus(key) {
      els.apiStatus.textContent = `API: Key #${currentKeyIndex + 1}`;
      els.usage.textContent = `Req: ${requestCount}/10 per min`;
    }

    // Status
    function showStatus(msg, type = 'loading') {
      els.status.textContent = msg;
      els.status.className = `status ${type}`;
    }

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      };
    });

    // Stability slider
    document.getElementById('stability').oninput = (e) => {
      els.stabilityVal.textContent = e.target.value;
    };

    // TTS Function
    async function generateTTS() {
      const btn = document.getElementById('tts-btn');
      const text = document.getElementById('text').value.trim();
      const voice = document.getElementById('voice').value.trim();
      const model = document.getElementById('model').value;
      const format = document.getElementById('format').value;
      const stability = parseFloat(document.getElementById('stability').value);

      if (!text || !voice) return showStatus('Enter text & voice ID', 'error');

      btn.disabled = true;
      btn.textContent = '⏳ Generating...';
      showStatus('Calling ElevenLabs API...');

      const apiKey = getNextApiKey();
      const controller = new AbortController();

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`, {
          method: 'POST',
          headers: {
            'xi-api-key': apiKey,
            'Content-Type': 'application/json',
            'Accept': 'audio/mpeg'
          },
          signal: controller.signal,
          body: JSON.stringify({
            text: text,
            model_id: model,
            voice_settings: { stability, similarity_boost: 0.75 },
            output_format: format
          })
        });

        if (!response.ok) {
          const error = await response.text();
          throw new Error(`HTTP ${response.status}: ${error}`);
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        els.player.src = audioUrl;
        els.player.play();
        els.audioSection.style.display = 'block';
        els.download.href = audioUrl;
        els.download.style.display = 'inline-block';
        els.download.download = `tts-${Date.now()}.mp3`;

        showStatus('✅ Audio generated successfully!', 'success');
      } catch (error) {
        if (error.name === 'AbortError') {
          showStatus('Request cancelled', 'error');
        } else {
          showStatus(`❌ ${error.message}`, 'error');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '🎙️ Generate Speech';
      }
    }

    // Voice Changer Recording
    document.getElementById('record-btn').onclick = async () => {
      const btn = event.target;
      if (mediaRecorder?.state === 'recording') {
        mediaRecorder.stop();
        btn.textContent = '🔴 Start Recording';
      } else {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        recordedChunks = [];
        
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          document.getElementById('input-audio').src = url;
          document.getElementById('input-audio').style.display = 'block';
        };
        
        mediaRecorder.start();
        btn.textContent = '⏹️ Stop Recording';
      }
    };

    // Voice Conversion (Speech-to-Speech)
    document.getElementById('stt-btn').onclick = async () => {
      const btn = document.getElementById('stt-btn');
      const inputAudio = document.getElementById('input-audio');
      const voice = document.getElementById('stt-voice').value.trim();

      if (!inputAudio.src) return showStatus('Record audio first', 'error');

      btn.disabled = true;
      btn.textContent = '🔄 Converting...';
      showStatus('Converting voice...');

      const apiKey = getNextApiKey();
      
      // Convert recorded audio to blob
      const audioBlob = await fetch(inputAudio.src).then(r => r.blob());
      
      const formData = new FormData();
      formData.append('voice_id', voice);
      formData.append('model_id', 'eleven_multilingual_v2');
      formData.append('audio', audioBlob, 'input.webm');

      try {
        const response = await fetch('https://api.elevenlabs.io/v1/speech-to-speech', {
          method: 'POST',
          headers: { 'xi-api-key': apiKey },
          body: formData
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        els.player.src = audioUrl;
        els.player.play();
        els.audioSection.style.display = 'block';
        els.download.href = audioUrl;
        els.download.download = `voice-${Date.now()}.mp3`;
        els.download.style.display = 'inline-block';

        showStatus('✅ Voice converted!', 'success');
      } catch (error) {
        showStatus(`❌ ${error.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🔄 Convert Voice';
      }
    };

    // Event Listeners
    document.getElementById('tts-btn').onclick = generateTTS;
  </script>
</body>
</html>
