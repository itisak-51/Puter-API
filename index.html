<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧞‍♂️ AI Akinator - Gemini Powered</title>
  <style>
    /* Same beautiful CSS as before */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .game-container { background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-width: 500px; width: 90%; overflow: hidden; }
    .header { background: linear-gradient(135deg, #ff6b6b, #feca57); padding: 20px; text-align: center; }
    .header h1 { font-size: 1.8rem; color: white; margin-bottom: 5px; }
    .genie { font-size: 4rem; margin-bottom: -20px; }
    .content { padding: 30px; }
    .question { font-size: 1.3rem; font-weight: 600; margin-bottom: 25px; text-align: center; }
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .answer-btn { padding: 15px 20px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .answer-btn.yes { background: #10b981; color: white; }
    .answer-btn.no { background: #ef4444; color: white; }
    .answer-btn.probably { background: #f59e0b; color: white; }
    .answer-btn.probably-not { background: #6b7280; color: white; }
    .answer-btn.dont-know { background: #9ca3af; color: #374151; grid-column: span 2; margin-top: 10px; }
    .progress { height: 6px; background: #e5e7eb; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #10b981, #f59e0b); width: 0%; transition: width 0.5s; }
    .guess-section { text-align: center; display: none; }
    .character-img { width: 180px; height: 180px; border-radius: 20px; object-fit: cover; margin: 20px auto; border: 5px solid #f3f4f6; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    .api-status { background: #10b981; color: white; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.9rem; }
    .start-btn, .restart-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 15px 30px; border: none; border-radius: 25px; font-size: 1.1rem; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="genie">🧞‍♂️</div>
      <h1>AI Akinator Pro</h1>
    </div>
    
    <div class="content">
      <div class="api-status" id="api-status">
        🔑 Gemini API Ready | 📸 Unsplash Images
      </div>
      
      <div id="start-screen">
        <h2 style="margin-bottom: 20px;">🎮 Think of Anyone Famous!</h2>
        <p style="color: #6b7280; margin-bottom: 30px;">
          Cricketer, Actor, Politician - Pakistani/Global<br>
          <strong>Gemini AI</strong> will ask smart questions!
        </p>
        <button class="start-btn" onclick="startGame()">🚀 Start</button>
      </div>

      <div id="game-screen" style="display: none;">
        <div class="progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="question" id="question">Loading smart question...</div>
        <div class="answers" id="answers"></div>
      </div>

      <div id="guess-screen" class="guess-section">
        <img id="character-img" class="character-img" src="" alt="">
        <div id="character-name" style="font-size: 1.5rem; font-weight: bold; margin: 15px 0;"></div>
        <p id="guess-text"></p>
        <button class="restart-btn" onclick="startGame()">🔄 New Game</button>
      </div>
    </div>
  </div>

  <script>
    // ========== YOUR GEMINI API KEY ==========
    const GEMINI_API_KEY = 'AIzaSyD5e2sFXE0UI7A8v3dQ3Vx_ygrv9zadHrw';  // ai.google.dev se lo
    // ========================================

    let answersHistory = [];
    let currentQuestion = '';
    let progress = 0;

    async function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      document.getElementById('guess-screen').style.display = 'none';
      
      answersHistory = [];
      progress = 0;
      await askGeminiQuestion();
    }

    async function askGeminiQuestion() {
      document.getElementById('question').textContent = '🤖 AI Thinking...';
      
      try {
        const prompt = `Akinator game. User is thinking of a famous person (cricketer/actor/politician). Previous answers: ${JSON.stringify(answersHistory.slice(-5))}. 
        Ask ONE smart Yes/No question to narrow down. Pakistani or global famous people. Make it specific.`;
        
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });
        
        const data = await response.json();
        currentQuestion = data.candidates[0].content.parts[0].text.trim();
        
        document.getElementById('question').textContent = currentQuestion;
        
        renderAnswers();
        updateProgress();
        
      } catch (error) {
        document.getElementById('question').textContent = 'Error: Check API key';
        console.error('Gemini Error:', error);
      }
    }

    function renderAnswers() {
      const answersDiv = document.getElementById('answers');
      answersDiv.innerHTML = `
        <button class="answer-btn yes" onclick="selectAnswer('Yes')">✅ Yes</button>
        <button class="answer-btn no" onclick="selectAnswer('No')">❌ No</button>
        <button class="answer-btn probably" onclick="selectAnswer('Probably')">🤔 Probably</button>
        <button class="answer-btn probably-not" onclick="selectAnswer('Probably not')">🤷 Probably not</button>
        <button class="answer-btn dont-know" onclick="selectAnswer('I don\\'t know')" style="grid-column: span 2;">❓ Don't know</button>
      `;
    }

    async function selectAnswer(answer) {
      answersHistory.push(`${currentQuestion} → ${answer}`);
      
      // Next question or guess?
      if (answersHistory.length >= 15 || answer === "I don't know") {
        await makeFinalGuess();
        return;
      }
      
      setTimeout(askGeminiQuestion, 800);
    }

    async function makeFinalGuess() {
      try {
        const prompt = `Akinator FINAL GUESS. Based on these answers: ${JSON.stringify(answersHistory)}.
        Who is the famous person? Pakistani/Global - Cricketer/Actor/Politician/Musician.
        Respond ONLY with: "NAME OF PERSON"`;
        
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });
        
        const data = await response.json();
        const guess = data.candidates[0].content.parts[0].text.trim();
        
        showGuess(guess);
        
      } catch (error) {
        showGuess("I couldn't guess! 😅");
      }
    }

    function showGuess(name) {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('guess-screen').style.display = 'block';
      
      // Unsplash Image API - REAL PHOTOS!
      const imgUrl = `https://source.unsplash.com/200x200/?${name.replace(' ', '+')}`;
      document.getElementById('character-img').src = imgUrl;
      document.getElementById('character-img').onerror = () => {
        document.getElementById('character-img').src = `https://via.placeholder.com/200x200/667eea/ffffff?text=${name.substring(0,1)}`;
      };
      
      document.getElementById('character-name').textContent = name;
      document.getElementById('guess-text').textContent = `Is it ${name}? 🎯`;
    }

    function updateProgress() {
      progress = (answersHistory.length / 15) * 100;
      document.getElementById('progress-bar').style.width = progress + '%';
    }
  </script>
</body>
</html>
