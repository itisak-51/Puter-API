<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧞‍♂️ Akinator Pakistan Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .game-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 90%;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.8rem;
      color: white;
      margin-bottom: 5px;
    }
    .genie {
      font-size: 4rem;
      margin-bottom: -20px;
    }
    .content {
      padding: 30px;
    }
    .question {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.4;
    }
    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .answer-btn {
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .answer-btn.yes { background: #10b981; color: white; }
    .answer-btn.no { background: #ef4444; color: white; }
    .answer-btn.probably { background: #f59e0b; color: white; }
    .answer-btn.probably-not { background: #6b7280; color: white; }
    .answer-btn.dont-know { background: #9ca3af; color: #374151; }
    .answer-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
    .progress {
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #f59e0b);
      width: 0%;
      transition: width 0.5s;
    }
    .guess-section {
      text-align: center;
      display: none;
    }
    .character-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin: 20px auto;
      border: 5px solid #f3f4f6;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .character-name {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 15px 0;
      color: #1f2937;
    }
    .restart-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
    .stats {
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
      margin-top: 20px;
    }
    .start-screen, .win-screen {
      text-align: center;
    }
    .start-btn {
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      color: white;
      padding: 15px 40px;
      border: none;
      border-radius: 25px;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(255,107,107,0.4);
    }
    @media (max-width: 480px) {
      .answers { grid-template-columns: 1fr; }
      .genie { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="genie">🧞‍♂️</div>
      <h1>Akinator Pakistan</h1>
    </div>
    
    <div class="content">
      <!-- Start Screen -->
      <div id="start-screen" class="start-screen">
        <h2>🎮 Think of a Character!</h2>
        <p style="margin: 20px 0; color: #6b7280;">
          Movie hero, cricketer, politician, or anyone famous!<br>
          I'll guess in maximum 20 questions.
        </p>
        <button class="start-btn" onclick="startGame()">🚀 Start Game</button>
      </div>

      <!-- Game Screen -->
      <div id="game-screen" style="display: none;">
        <div class="progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
      </div>

      <!-- Guess Screen -->
      <div id="guess-screen" class="guess-section">
        <img id="character-img" class="character-img" src="" alt="Character">
        <div id="character-name" class="character-name"></div>
        <p id="guess-text"></p>
        <button class="restart-btn" onclick="startGame()">🔄 Play Again</button>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>

  <script>
    // Pakistani & Global Characters Database
    const characters = [
      // Cricket Stars
      { name: "Babar Azam", img: "https://via.placeholder.com/150x150/ff6b6b/ffffff?text=Babar", 
        questions: { male: true, cricketer: true, batsman: true, captain: true, current: true } },
      { name: "Imran Khan", img: "https://via.placeholder.com/150x150/4ecdc4/ffffff?text=Imran", 
        questions: { male: true, cricketer: true, captain: true, politician: true, pm: true } },
      { name: "Wasim Akram", img: "https://via.placeholder.com/150x150/45b7d1/ffffff?text=Wasim", 
        questions: { male: true, cricketer: true, bowler: true, legend: true } },
      
      // Movie Stars
      { name: "Shah Rukh Khan", img: "https://via.placeholder.com/150x150/f39c12/ffffff?text=SRK", 
        questions: { male: true, actor: true, bollywood: true, king: true } },
      { name: "Salman Khan", img: "https://via.placeholder.com/150x150/e74c3c/ffffff?text=Salman", 
        questions: { male: true, actor: true, bollywood: true, bhai: true } },
      { name: "Hamza Ali Abbasi", img: "https://via.placeholder.com/150x150/9b59b6/ffffff?text=Hamza", 
        questions: { male: true, actor: true, pakistani: true, peshawari: true } },
      
      // Politicians
      { name: "Imran Khan", img: "https://via.placeholder.com/150x150/27ae60/ffffff?text=PM", 
        questions: { male: true, politician: true, pm: true, cricketer: true } },
      { name: "Nawaz Sharif", img: "https://via.placeholder.com/150x150/3498db/ffffff?text=Nawaz", 
        questions: { male: true, politician: true, pm: true, pmln: true } },
      
      // Global
      { name: "Cristiano Ronaldo", img: "https://via.placeholder.com/150x150/e74c3c/ffffff?text=CR7", 
        questions: { male: true, footballer: true, portugal: true } },
      { name: "Virat Kohli", img: "https://via.placeholder.com/150x150/2980b9/ffffff?text=Virat", 
        questions: { male: true, cricketer: true, batsman: true, indian: true } },
      { name: "Iron Man", img: "https://via.placeholder.com/150x150/f39c12/ffffff?text=IronMan", 
        questions: { male: true, superhero: true, avenger: true, tony: true } }
    ];

    let currentQuestionIndex = 0;
    let answers = {};
    let gameQuestions = [];
    let progress = 0;

    const questions = [
      "Is it a male?",
      "Is he a cricketer?",
      "Is he a real person?",
      "Is he Pakistani?",
      "Is he alive?",
      "Does he play cricket?",
      "Is he a batsman?",
      "Is he a bowler?",
      "Is he a politician?",
      "Has he been Prime Minister?",
      "Is he an actor?",
      "Is he from Bollywood?",
      "Is he a footballer?",
      "Is he a superhero?",
      "Is he a captain?",
      "Is he currently playing?",
      "Is he a legend?"
    ];

    function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      document.getElementById('guess-screen').style.display = 'none';
      
      currentQuestionIndex = 0;
      answers = {};
      progress = 0;
      gameQuestions = questions.slice(0, 20); // Max 20 questions
      
      nextQuestion();
    }

    function nextQuestion() {
      if (currentQuestionIndex >= gameQuestions.length || guessCharacter()) {
        showGuess();
        return;
      }
      
      const question = gameQuestions[currentQuestionIndex];
      document.getElementById('question').textContent = question;
      
      const answersDiv = document.getElementById('answers');
      answersDiv.innerHTML = `
        <button class="answer-btn yes" onclick="answer('yes')">✅ Yes</button>
        <button class="answer-btn no" onclick="answer('no')">❌ No</button>
        <button class="answer-btn probably" onclick="answer('probably')">🤔 Probably</button>
        <button class="answer-btn probably-not" onclick="answer('probably-not')">🤷 Probably Not</button>
        <button class="answer-btn dont-know" onclick="answer('dont-know')" style="grid-column: span 2; margin-top: 10px;">❓ I don't know</button>
      `;
      
      updateProgress();
      currentQuestionIndex++;
    }

    function answer(answerType) {
      const question = gameQuestions[currentQuestionIndex - 1].toLowerCase();
      answers[question] = answerType;
      
      // Audio feedback
      playSound(answerType);
      
      setTimeout(nextQuestion, 500);
    }

    function updateProgress() {
      const percent = (currentQuestionIndex / 20) * 100;
      document.getElementById('progress-bar').style.width = percent + '%';
    }

    function guessCharacter() {
      let bestMatch = null;
      let highestScore = 0;
      
      characters.forEach(character => {
        let score = 0;
        let totalQuestions = 0;
        
        Object.keys(character.questions).forEach(q => {
          const userAnswer = answers[q];
          if (userAnswer) {
            totalQuestions++;
            if (userAnswer === 'yes' && character.questions[q]) score += 2;
            else if (userAnswer === 'no' && !character.questions[q]) score += 2;
            else if (userAnswer === 'probably' && character.questions[q]) score += 1;
            else if (userAnswer === 'probably-not' && !character.questions[q]) score += 1;
          }
        });
        
        const matchPercent = totalQuestions > 0 ? (score / (totalQuestions * 2)) * 100 : 0;
        if (matchPercent > highestScore) {
          highestScore = matchPercent;
          bestMatch = character;
        }
      });
      
      if (highestScore > 40) {
        showCharacter(bestMatch, highestScore);
        return true;
      }
      return false;
    }

    function showCharacter(character, confidence) {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('guess-screen').style.display = 'block';
      
      document.getElementById('character-img').src = character.img;
      document.getElementById('character-name').textContent = character.name;
      document.getElementById('guess-text').textContent = 
        `Is it ${character.name}? (${Math.round(confidence)}% confident)`;
      
      document.getElementById('stats').innerHTML = `
        Questions asked: ${currentQuestionIndex}<br>
        Try again if wrong!
      `;
      
      // Celebration
      confettiEffect();
    }

    function showGuess() {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('guess-screen').style.display = 'block';
      
      document.getElementById('character-img').src = 'https://via.placeholder.com/150x150/6c757e/ffffff?text=🤷';
      document.getElementById('character-name').textContent = 'I give up!';
      document.getElementById('guess-text').textContent = 
        `Couldn\'t guess in ${currentQuestionIndex} questions. You win!`;
    }

    // Sound Effects
    function playSound(type) {
      const audio = new Audio();
      audio.src = `data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhAY8m9v9x2QQAoUXrTp66hVFApGn+DyvmwhAY8m9v9x2QQ=`;
      audio.volume = 0.3;
      audio.play().catch(() => {});
    }

    // Confetti Animation
    function confettiEffect() {
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'fixed';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-10px';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
        confetti.style.pointerEvents = 'none';
        confetti.style.zIndex = '9999';
        document.body.appendChild(confetti);
        
        confetti.animate([
          { transform: 'translateY(-10px) rotate(0deg)', opacity: 1 },
          { transform: `translateY(100vh) rotate(720deg)`, opacity: 0 }
        ], {
          duration: 3000 + Math.random() * 2000,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        }).onfinish = () => confetti.remove();
      }
    }
  </script>
</body>
</html>
